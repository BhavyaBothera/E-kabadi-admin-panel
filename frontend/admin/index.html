<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="E-Kabadi Command Center — Smart Waste Management Administration">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <title>E-Kabadi | Command Center</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="login-page">

    <div class="login-background">
        <div class="ambient ambient-1"></div>
        <div class="ambient ambient-2"></div>
        <div class="ambient ambient-3"></div>
    </div>

    <main class="login-wrapper">

        <div class="login-brand">
            <div class="brand-mark"><i data-lucide="recycle"></i></div>
            <div><h1>E-Kabadi</h1><span>COMMAND CENTER</span></div>
        </div>

        <section class="login-card">

            <div class="login-header">
                <div class="login-icon"><i data-lucide="shield-check"></i></div>
                <h2>Welcome back</h2>
                <p>Sign in to manage the E-Kabadi ecosystem.</p>
            </div>

            <form id="loginForm" novalidate>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail"></i>
                        <input type="email" id="email" name="email" placeholder="admin@ekabadi.demo" autocomplete="email" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="form-label-row">
                        <label for="password">Password</label>
                        <span class="demo-label">Demo access</span>
                    </div>
                    <div class="input-wrapper">
                        <i data-lucide="lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>

                <div id="loginError" class="form-error hidden" role="alert" aria-live="polite"></div>

                <button type="submit" class="btn btn-primary btn-full" id="loginButton">
                    <span>Enter Command Center</span>
                    <i data-lucide="arrow-right"></i>
                </button>

            </form>

            <div class="demo-credentials">
                <div class="demo-header">
                    <i data-lucide="info"></i>
                    <span>Hackathon demo credentials</span>
                </div>
                <div class="credential-row">
                    <span>Email</span>
                    <button type="button" data-copy="admin@ekabadi.demo" class="credential-value">admin@ekabadi.demo</button>
                </div>
                <div class="credential-row">
                    <span>Password</span>
                    <button type="button" data-copy="admin123" class="credential-value">admin123</button>
                </div>
            </div>

        </section>

        <footer class="login-footer">
            <span>E-Kabadi Command Center</span>
            <span class="footer-dot"></span>
            <span>Smart Waste Management</span>
        </footer>

        <div style="text-align:center;margin-top:16px;font-size:13px;color:rgba(255,255,255,0.7);">
            <a href="../public/index.html" style="color:#C5D86D;text-decoration:underline;font-weight:600;">Visit E-Kabaadi Public Platform & Portal →</a>
        </div>

    </main>

    <div id="toastRoot" class="toast-container"></div>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
    <script>if (window.lucide) lucide.createIcons();</script>

</body>
</html>
