<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your password — E-Kabaadi Clean Tech Platform.">
    <title>E-Kabaadi | Reset Password</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="../shared/css/ui-states.css">
</head>
<body class="auth-page">

<div class="auth-bg">
    <div class="auth-gradient"></div>
    <div class="auth-pattern"></div>
</div>

<main class="auth-wrapper">
    <a href="../public/index.html" class="auth-brand">
        <div class="auth-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 7 3-4 3 4M10 3v7M17 10h5l-3 5M22 10l-6-1M7 17l-4 4M3 21l2-6M7 17h7a4 4 0 0 0 3-7M10 10a4 4 0 0 0-3 7"/></svg>
        </div>
        <span>E-Kabaadi</span>
    </a>

    <!-- Stage 1: Request Password Reset Link -->
    <section class="auth-card" id="requestResetCard">
        <div class="auth-card-header">
            <h1>Reset Password</h1>
            <p>Enter your registered email address to receive a secure recovery link.</p>
        </div>

        <form id="resetForm" novalidate>
            <div class="form-group">
                <label for="resetEmail">Registered Email</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="m22 6-10 7L2 6"/></svg>
                    <input type="email" id="resetEmail" placeholder="e.g. citizen@ekabadi.demo" required autocomplete="email">
                </div>
            </div>

            <div id="resetFeedback" class="form-error" style="display:none;" role="alert"></div>

            <button type="submit" class="btn btn-submit" id="resetBtn">
                <span>Send Reset Link</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
            </button>
        </form>

        <div class="auth-footer-text" style="margin-top: 24px;">
            Remembered your credentials? <a href="login.html">Back to Sign In →</a>
        </div>
    </section>

    <!-- Stage 2: Set New Password (Rendered when returning via recovery link) -->
    <section class="auth-card" id="updatePasswordCard" style="display:none;">
        <div class="auth-card-header">
            <h1>Set New Password</h1>
            <p>Choose a strong password with at least 8 characters.</p>
        </div>

        <form id="updatePasswordForm" novalidate>
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <input type="password" id="newPassword" placeholder="Minimum 8 characters" required minlength="8" autocomplete="new-password">
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <input type="password" id="confirmPassword" placeholder="Re-enter new password" required minlength="8" autocomplete="new-password">
                </div>
            </div>

            <div id="updateFeedback" class="form-error" style="display:none;" role="alert"></div>

            <button type="submit" class="btn btn-submit" id="updateBtn">
                <span>Update Password</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
            </button>
        </form>

        <div class="auth-footer-text" style="margin-top: 24px;">
            Cancel and return to <a href="login.html">Sign In →</a>
        </div>
    </section>

    <footer class="auth-footer">
        <span>© 2026 E-Kabaadi Inc. All rights reserved.</span>
    </footer>
</main>

<!-- Scripts -->
<script src="../config/config-loader.js"></script>
<script src="../config/environment.js"></script>
<script src="../shared/js/security-utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/js/supabase-client.js"></script>
<script src="../shared/js/supabase-adapter.js"></script>
<script src="../data/mock-users.js"></script>
<script src="../data/mock-citizens.js"></script>
<script src="../data/mock-collectors.js"></script>
<script src="../data/mock-pickups.js"></script>
<script src="../data/mock-payments.js"></script>
<script src="../data/mock-rewards.js"></script>
<script src="../data/mock-notifications.js"></script>
<script src="../data/mock-scrap.js"></script>
<script src="../shared/js/storage.js"></script>
<script src="../shared/js/services.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    var isRecoveryMode = window.location.hash && (
        window.location.hash.includes("type=recovery") ||
        window.location.hash.includes("access_token=")
    );

    var requestCard = document.getElementById("requestResetCard");
    var updateCard = document.getElementById("updatePasswordCard");

    if (isRecoveryMode) {
        requestCard.style.display = "none";
        updateCard.style.display = "block";
    }

    // Stage 1: Request Reset Form
    var resetForm = document.getElementById("resetForm");
    resetForm.addEventListener("submit", function (e) {
        e.preventDefault();
        var emailInput = document.getElementById("resetEmail");
        var feedback = document.getElementById("resetFeedback");
        var submitBtn = document.getElementById("resetBtn");
        var email = (emailInput.value || "").trim();

        if (!email || !email.includes("@")) {
            feedback.style.display = "block";
            feedback.style.color = "#dc2626";
            feedback.textContent = "Please enter a valid registered email address.";
            return;
        }

        submitBtn.disabled = true;
        submitBtn.classList.add("loading");

        var resetPromise = (typeof authService !== "undefined" && typeof authService.resetPassword === "function")
            ? authService.resetPassword(email)
            : Promise.resolve({ success: true });

        Promise.resolve(resetPromise).then(function () {
            // Neutral message to prevent account enumeration
            feedback.style.display = "block";
            feedback.style.color = "#16a34a";
            feedback.textContent = "✓ If an account exists with " + (typeof EKABADI_SECURITY !== "undefined" ? EKABADI_SECURITY.escapeHtml(email) : email) + ", a password reset link has been dispatched.";
            emailInput.value = "";
            submitBtn.disabled = false;
            submitBtn.classList.remove("loading");
        }).catch(function () {
            feedback.style.display = "block";
            feedback.style.color = "#16a34a";
            feedback.textContent = "✓ If an account exists with that email, a password reset link has been dispatched.";
            submitBtn.disabled = false;
            submitBtn.classList.remove("loading");
        });
    });

    // Stage 2: Update Password Form
    var updateForm = document.getElementById("updatePasswordForm");
    updateForm.addEventListener("submit", function (e) {
        e.preventDefault();
        var passInput = document.getElementById("newPassword");
        var confirmInput = document.getElementById("confirmPassword");
        var feedback = document.getElementById("updateFeedback");
        var updateBtn = document.getElementById("updateBtn");

        var pass = passInput.value;
        var confirm = confirmInput.value;

        if (!pass || pass.length < 8) {
            feedback.style.display = "block";
            feedback.style.color = "#dc2626";
            feedback.textContent = "Password must be at least 8 characters long.";
            return;
        }

        if (pass !== confirm) {
            feedback.style.display = "block";
            feedback.style.color = "#dc2626";
            feedback.textContent = "Passwords do not match.";
            return;
        }

        updateBtn.disabled = true;
        updateBtn.classList.add("loading");

        var updatePromise = (typeof authService !== "undefined" && typeof authService.updatePassword === "function")
            ? authService.updatePassword(pass)
            : Promise.resolve({ success: true });

        Promise.resolve(updatePromise).then(function (res) {
            if (res && res.success) {
                feedback.style.display = "block";
                feedback.style.color = "#16a34a";
                feedback.textContent = "✓ Password successfully updated! Redirecting to login...";
                setTimeout(function () {
                    window.location.href = "login.html";
                }, 2000);
            } else {
                feedback.style.display = "block";
                feedback.style.color = "#dc2626";
                feedback.textContent = (res && res.error) || "Failed to update password. Recovery link may have expired.";
                updateBtn.disabled = false;
                updateBtn.classList.remove("loading");
            }
        }).catch(function (err) {
            feedback.style.display = "block";
            feedback.style.color = "#dc2626";
            feedback.textContent = err && err.message ? err.message : "Failed to update password.";
            updateBtn.disabled = false;
            updateBtn.classList.remove("loading");
        });
    });
});
</script>

</body>
</html>
