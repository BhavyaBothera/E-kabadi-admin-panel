<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your password — E-Kabaadi Clean Tech Platform.">
    <title>E-Kabaadi | Reset Password</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

<div class="auth-bg">
    <div class="auth-gradient"></div>
    <div class="auth-pattern"></div>
</div>

<main class="auth-wrapper">
    <a href="../public/index.html" class="auth-brand">
        <div class="auth-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 7 3-4 3 4M10 3v7M17 10h5l-3 5M22 10l-6-1M7 17l-4 4M3 21l2-6M7 17h7a4 4 0 0 0 3-7M10 10a4 4 0 0 0-3 7"/></svg>
        </div>
        <span>E-Kabaadi</span>
    </a>

    <section class="auth-card">
        <div class="auth-card-header">
            <h1>Reset Password</h1>
            <p>Enter your verified email or mobile number to receive a secure recovery code</p>
        </div>

        <form id="resetForm" novalidate>
            <div class="form-group">
                <label for="resetEmail">Email or Phone Number</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="m22 6-10 7L2 6"/></svg>
                    <input type="text" id="resetEmail" placeholder="e.g. citizen@ekabadi.demo" required>
                </div>
            </div>

            <div id="resetFeedback" class="form-error" style="display:none;" role="alert"></div>

            <button type="submit" class="btn btn-submit" id="resetBtn">
                <span>Send Reset Link</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
            </button>
        </form>

        <div class="auth-footer-text" style="margin-top: 24px;">
            Remembered your credentials? <a href="login.html">Back to Sign In →</a>
        </div>
    </section>

    <footer class="auth-footer">
        <span>© 2026 E-Kabaadi Inc. All rights reserved.</span>
    </footer>
</main>

<script>
document.getElementById("resetForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const input = document.getElementById("resetEmail").value.trim();
    const feedback = document.getElementById("resetFeedback");
    if (!input) {
        feedback.style.display = "block";
        feedback.style.color = "#dc2626";
        feedback.textContent = "Please enter your registered email or phone number.";
        return;
    }
    feedback.style.display = "block";
    feedback.style.color = "#16a34a";
    feedback.textContent = "✓ If an account exists with " + input + ", a password reset link has been dispatched.";
    setTimeout(function() {
        window.location.href = "login.html";
    }, 2800);
});
</script>

</body>
</html>
